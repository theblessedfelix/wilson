<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Post - Branding Services</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #f0f0f0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        .instagram-post {
            width: 1080px;
            height: 1080px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }
        .decorative-circle {
            position: absolute;
            border-radius: 50%;
            opacity: 0.1;
        }
        .circle-1 {
            width: 400px;
            height: 400px;
            background: white;
            top: -150px;
            left: -150px;
        }
        .circle-2 {
            width: 300px;
            height: 300px;
            background: white;
            bottom: -100px;
            right: -100px;
        }
        .content {
            position: relative;
            z-index: 10;
            text-align: center;
            color: white;
            padding: 60px;
        }
        .icon {
            font-size: 120px;
            margin-bottom: 30px;
        }
        .main-text {
            font-size: 72px;
            font-weight: 800;
            margin: 20px 0;
            line-height: 1.2;
        }
        .subtext {
            font-size: 32px;
            font-weight: 300;
            margin: 20px 0;
            opacity: 0.95;
        }
        .cta {
            margin-top: 40px;
            font-size: 24px;
            font-weight: 600;
            padding: 15px 40px;
            background: white;
            color: #667eea;
            border-radius: 50px;
            display: inline-block;
        }
    </style>
</head>
<body>
    <div class="instagram-post">
        <div class="decorative-circle circle-1"></div>
        <div class="decorative-circle circle-2"></div>
        <div class="content">
            <div class="icon">✨</div>
            <div class="main-text">BRANDING<br>THAT STANDS OUT</div>
            <div class="subtext">Create a distinctive identity<br>your audience will remember</div>
            <div class="cta">DISCOVER HOW</div>
        </div>
    </div>
</body>
</html>
