<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinkedIn Post - All Services</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #f0f0f0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        .linkedin-post {
            width: 1200px;
            height: 627px;
            background: linear-gradient(90deg, #ffffff 0%, #f8f9fa 100%);
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            border-left: 8px solid #0A66C2;
        }
        .left-side {
            flex: 1;
            padding: 60px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .right-side {
            flex: 1;
            background: linear-gradient(135deg, #0A66C2 0%, #004182 100%);
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 120px;
        }
        .tagline {
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 1px;
            color: #0A66C2;
            text-transform: uppercase;
            margin-bottom: 10px;
        }
        .title {
            font-size: 42px;
            font-weight: 900;
            color: #000;
            margin: 15px 0;
            line-height: 1.2;
        }
        .description {
            font-size: 16px;
            color: #555;
            line-height: 1.6;
            margin-top: 20px;
        }
        .cta {
            margin-top: 25px;
            font-size: 14px;
            font-weight: 700;
            color: #0A66C2;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div class="linkedin-post">
        <div class="left-side">
            <div class="tagline">🎨 Design Services</div>
            <div class="title">Turn Ideas Into<br>Unforgettable<br>Experiences</div>
            <div class="description">
                From brand identity to interactive experiences, we help you connect with your audience through strategic design.
            </div>
            <div class="cta">→ Learn More</div>
        </div>
        <div class="right-side">✨</div>
    </div>
</body>
</html>
