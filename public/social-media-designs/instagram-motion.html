<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Post - Motion Design</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #f0f0f0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        .instagram-post {
            width: 1080px;
            height: 1080px;
            background: linear-gradient(45deg, #ff6b6b 0%, #feca57 50%, #48dbfb 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }
        .floating-shapes {
            position: absolute;
            width: 100%;
            height: 100%;
        }
        .shape {
            position: absolute;
            opacity: 0.15;
        }
        .circle {
            border-radius: 50%;
            background: white;
        }
        .square {
            background: white;
            transform: rotate(45deg);
        }
        .content {
            position: relative;
            z-index: 10;
            text-align: center;
            color: white;
        }
        .label {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 20px;
            text-transform: uppercase;
            opacity: 0.95;
        }
        .main-text {
            font-size: 104px;
            font-weight: 900;
            margin: 20px 0;
            line-height: 0.9;
            text-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
        }
        .subtext {
            font-size: 36px;
            font-weight: 500;
            margin-top: 30px;
            max-width: 700px;
        }
        .animation-indicator {
            margin-top: 50px;
            font-size: 28px;
            font-weight: 600;
            padding: 20px 40px;
            background: rgba(255, 255, 255, 0.25);
            border-radius: 50px;
            backdrop-filter: blur(10px);
            display: inline-block;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
    </style>
</head>
<body>
    <div class="instagram-post">
        <div class="floating-shapes">
            <div class="shape circle" style="width: 200px; height: 200px; top: 100px; left: 50px;"></div>
            <div class="shape square" style="width: 150px; height: 150px; top: 300px; right: 100px;"></div>
            <div class="shape circle" style="width: 250px; height: 250px; bottom: 150px; right: 50px;"></div>
            <div class="shape square" style="width: 120px; height: 120px; bottom: 50px; left: 100px;"></div>
        </div>
        <div class="content">
            <div class="label">Motion Design</div>
            <div class="main-text">BRING<br>IT TO LIFE</div>
            <div class="subtext">
                Captivating animations that<br>engage and convert
            </div>
            <div class="animation-indicator">
                ✨ Animations that Move
            </div>
        </div>
    </div>
</body>
</html>
