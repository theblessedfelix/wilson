<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Post - Social Media Design</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #f0f0f0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        .instagram-post {
            width: 1080px;
            height: 1080px;
            background: linear-gradient(to right, #f093fb 0%, #f5576c 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }
        .pattern {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0.15;
            background-image: 
                repeating-linear-gradient(45deg, transparent, transparent 35px, white 35px, white 70px),
                repeating-linear-gradient(-45deg, transparent, transparent 35px, white 35px, white 70px);
        }
        .content {
            position: relative;
            z-index: 10;
            text-align: center;
            color: white;
        }
        .tagline {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 20px;
            letter-spacing: 2px;
            opacity: 0.9;
        }
        .main-text {
            font-size: 96px;
            font-weight: 900;
            margin: 20px 0;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            line-height: 1;
        }
        .description {
            font-size: 28px;
            font-weight: 400;
            margin-top: 30px;
            max-width: 700px;
            line-height: 1.4;
        }
        .highlight {
            background: rgba(255, 255, 255, 0.2);
            padding: 20px;
            border-radius: 15px;
            margin-top: 40px;
            font-size: 24px;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <div class="instagram-post">
        <div class="pattern"></div>
        <div class="content">
            <div class="tagline">SOCIAL MEDIA DESIGN</div>
            <div class="main-text">SCROLL<br>STOP<br>CONVERT</div>
            <div class="description">
                Thumb-stopping visuals that<br>engage your audience
            </div>
            <div class="highlight">
                📱 20+ Template Variations
            </div>
        </div>
    </div>
</body>
</html>
